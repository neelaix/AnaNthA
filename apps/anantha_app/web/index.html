<!DOCTYPE html>
<html lang="en">
<head>
  <!--
    The path provided below has to start and end with a slash "/" in order for
    it to work correctly. It is replaced with the `--base-href` argument
    provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description" content="ANAṆTHA — a premium productivity companion that reminds you about your goals even when you are away.">
  <meta name="theme-color" content="#0f0f1e">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="ANAṆTHA">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>ANAṆTHA — Plan. Progress. Become Infinite.</title>
  <link rel="manifest" href="manifest.json">

  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: #0f0f1e;
      overflow: hidden;
    }
    #flutter-splash {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 18px;
      background:
        radial-gradient(120% 80% at 50% 0%, #241a3d 0%, #0f0f1e 62%);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: #f3eefc;
      letter-spacing: 0.32em;
      text-transform: uppercase;
      transition: opacity 320ms ease;
    }
    #flutter-splash .mark {
      font-size: 20px;
      font-weight: 600;
    }
    #flutter-splash .dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #b39ddb;
      animation: pulse 1.2s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 0.25; transform: scale(0.8); }
      50% { opacity: 1; transform: scale(1.2); }
    }
  </style>
</head>
<body>
  <div id="flutter-splash">
    <div class="mark">ANAṆTHA</div>
    <div class="dot"></div>
  </div>

  <script>
    window.addEventListener('flutter-first-frame', function () {
      var splash = document.getElementById('flutter-splash');
      if (!splash) return;
      splash.style.opacity = '0';
      setTimeout(function () { splash.remove(); }, 360);
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
